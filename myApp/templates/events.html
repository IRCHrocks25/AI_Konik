<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — AI KONIK</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
.portal-wrap{max-width:1360px;margin:0 auto;padding:102px 20px 38px}
.hero{text-align:center;padding:28px 24px 24px;margin-bottom:16px}
.hero h1{margin:0 0 8px;font-family:'DM Serif Display',serif;color:#fff;font-size:clamp(34px,4vw,50px)}
.hero p{margin:0 auto;max-width:900px;color:rgba(255,255,255,.86);font-size:18px;line-height:1.6}
.ev-controls-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ev-search-wrap{position:relative;flex:1;min-width:220px}
.ev-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);font-size:14px;pointer-events:none}
.ev-search-input{width:100%;padding:12px 14px 12px 42px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;transition:border-color .15s}
.ev-search-input::placeholder{color:rgba(255,255,255,.45)}
.ev-search-input:focus{border-color:rgba(168,85,247,.55)}
.results-hint{color:rgba(255,255,255,.72);font-size:13px;white-space:nowrap}
@keyframes shimmer{from{opacity:.55}to{opacity:1}}
.industry-row{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 16px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.ind-filter{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.ind-filter i{font-size:11px;opacity:.85}
.ind-filter:hover{background:rgba(255,255,255,.12);color:#fff}
.ind-filter.active{border-color:rgba(214,203,255,.6);background:linear-gradient(120deg,rgba(168,85,247,.45),rgba(59,130,246,.35));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(139,92,246,.25)}
.ind-filter.active i{opacity:1}
.ind-skel{display:inline-block;border-radius:999px;background:rgba(255,255,255,.09);animation:shimmer 1.1s ease-in-out infinite alternate}
.events-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:16px}
.event-card{border:1px solid rgba(255,255,255,.24);border-radius:20px;overflow:hidden;transition:all .2s;background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.07));box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(6px)}
.event-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.45);box-shadow:0 14px 35px rgba(0,0,0,.3)}
.event-banner{height:92px;display:flex;align-items:center;padding:0 24px;font-size:34px;position:relative}
.event-banner-img{width:100%;height:100%;object-fit:cover;display:block}
.event-body{padding:22px}
.event-title{font-size:24px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:10px}
.event-meta{display:flex;gap:12px;font-size:13px;color:rgba(255,255,255,.76);margin-bottom:14px;flex-wrap:wrap}
.event-desc{font-size:15px;color:rgba(255,255,255,.86);line-height:1.7;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.event-footer{display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);min-height:40px}
.ev-skel-banner{background:rgba(255,255,255,.08);animation:shimmer 1.2s ease-in-out infinite alternate}
.ev-skel-line{border-radius:4px;animation:shimmer 1.2s ease-in-out infinite alternate}
@media(max-width:980px){.events-grid{grid-template-columns:1fr}}
@media(max-width:680px){.portal-wrap{padding:96px 14px 28px}.hero p{font-size:16px}}
</style>
<script>
/* Phase B email-verification + onboarding gate. Runs before page bootstrap. */
(function(){
  fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.authenticated)return;
    if(!d.email_verified){window.location.replace('/verify-email-required/');}
    else if(!d.onboarding_completed){window.location.replace('/onboarding/');}
  }).catch(function(){});
})();
</script>
</head>
<body class="dark-app">
<nav>
  <div class="nav-inner">
    <a href="{% url 'index' %}" class="logo"><div class="logo-dot"></div>AI KONIK</a>
    <button class="nav-hamburger" id="nav-hamburger-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="nav-links"><a href="{% url 'agents' %}">Agents</a><a href="{% url 'prompts' %}">Prompts</a><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'industries' %}">Industries</a><a href="{% url 'events' %}" class="active">Events</a><a href="{% url 'tools' %}">Tools</a></div>
    <div class="nav-cta profile-nav">
      <a href="/admin-dashboard/" class="admin-only admin-nav-btn"><i class="fa-solid fa-shield-halved"></i> Admin</a>
      <button type="button" class="sc-avatar" id="profile-menu-toggle" aria-haspopup="true" aria-expanded="false">SC</button>
      <div class="profile-menu" id="profile-menu">
        <a href="{% url 'profile' %}"><i class="fa-regular fa-user"></i> Profile</a>
        <a href="{% url 'billing' %}"><i class="fa-regular fa-credit-card"></i> Billing</a>
        <a href="{% url 'settings' %}"><i class="fa-solid fa-gear"></i> Settings</a>
        <button type="button" id="profile-signout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</button>
      </div>
    </div>
  </div>
</nav>
<script>
async function applyActiveBanners() {
  try {
    const r = await fetch('/api/banners', {credentials: 'same-origin'});
    if (!r.ok) return;
    const data = await r.json();
    const banners = data.banners || [];
    if (!banners.length) return;
    const visible = banners.filter(b =>
      b.is_dismissible
        ? !localStorage.getItem('ban-dismiss-' + b.id)
        : true
    );
    if (!visible.length) return;
    renderSystemBanner(visible[0]);
  } catch (e) {
    // Fail silently — banners are non-critical
  }
}
function renderSystemBanner(b) {
  const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]
  );
  const banner = document.createElement('div');
  banner.className = 'system-banner system-banner--' + b.banner_type;
  banner.id = 'system-banner-' + b.id;
  let html = '<span class="system-banner__msg">' + escHtml(b.message) + '</span>';
  if (b.is_dismissible) {
    html += '<button class="system-banner__dismiss" onclick="dismissSystemBanner(' + b.id + ')" aria-label="Dismiss">&times;</button>';
  }
  banner.innerHTML = html;
  document.body.prepend(banner);
  document.body.classList.add('has-system-banner');
}
function dismissSystemBanner(id) {
  localStorage.setItem('ban-dismiss-' + id, '1');
  const el = document.getElementById('system-banner-' + id);
  if (el) el.remove();
  document.body.classList.remove('has-system-banner');
}
function applyImpersonationBanner(meData) {
  if (!meData || !meData.is_impersonating) return;
  document.body.classList.add('impersonating');
  const b = document.createElement('div');
  b.className = 'impersonation-banner';
  const name = meData.first_name
    ? meData.first_name + (meData.last_name ? ' ' + meData.last_name : '')
    : meData.email;
  const safeName = String(name).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  b.innerHTML = `
    <span class="imp-banner-text">
      <i class="fa-solid fa-triangle-exclamation"></i>
      Impersonating <strong>${safeName}</strong>
    </span>
    <button class="imp-stop-btn" onclick="stopImpersonation()">
      Return to your account &rarr;
    </button>`;
  document.body.prepend(b);
}
async function stopImpersonation() {
  try {
    const r = await fetch('/api/admin/stop-impersonation', {
      method: 'POST',
      credentials: 'same-origin',
    });
    const d = await r.json();
    window.location.href = d.redirect || '/admin-dashboard/';
  } catch (e) {
    window.location.href = '/admin-dashboard/';
  }
}
fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
  if(d.is_admin)document.body.classList.add('admin-visible');
  applyImpersonationBanner(d);
  applyActiveBanners();
}).catch(()=>{});
</script>

<div class="page-shell portal-wrap">
  <section class="hero glass">
    <h1>Workshops, Summits &amp; Masterclasses</h1>
    <p>Learn directly from AI practitioners who've implemented AI across 40+ industries.</p>
  </section>
  <div>
    <div class="ev-controls-row">
      <div class="ev-search-wrap">
        <i class="fa-solid fa-magnifying-glass ev-search-icon"></i>
        <input type="text" id="ev-search" class="ev-search-input" placeholder="Search events…" autocomplete="off">
      </div>
      <span class="results-hint" id="results-hint"></span>
    </div>
    <section class="industry-row" id="ind-filters"></section>
    <div class="events-grid" id="events-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function escHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',4000);
}

function fmtEvDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const date = d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  const time = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  return date + ' · ' + time;
}

// Deterministic banner palette keyed by industry slug
const EV_BANNER_PAL = {
  legal:        {bg:'#EEF2FF', color:'#4f46e5'},
  healthcare:   {bg:'#F0FDF4', color:'#16a34a'},
  finance:      {bg:'#FFFBEB', color:'#d97706'},
  marketing:    {bg:'#FFF1F2', color:'#e11d48'},
  technology:   {bg:'#F0F9FF', color:'#0284c7'},
  realestate:   {bg:'#FDF4FF', color:'#9333ea'},
  accounting:   {bg:'#FFF7ED', color:'#ea580c'},
  logistics:    {bg:'#F0FDF9', color:'#0f9f6e'},
  manufacturing:{bg:'#FEF9C3', color:'#ca8a04'},
};
const EV_DEFAULT_PAL = {bg:'#EEF2FF', color:'#4f46e5'};

let allEvents = [];
let currentIndustry = '';
let evSearchVal = '';

// ── INDUSTRY FILTER ──────────────────────────────────────────────────────────
function initEvIndustryFilters() {
  const section = document.getElementById('ind-filters');
  if (!section) return;

  const SKEL_W = [72, 90, 72, 84, 96, 88];
  section.innerHTML = '<button class="ind-filter active" data-slug="" onclick="filterEvInd(\'\')">All</button>' +
    SKEL_W.map(function(w) { return '<span class="ind-skel" style="width:' + w + 'px;height:34px"></span>'; }).join('');

  const urlInd = new URLSearchParams(window.location.search).get('industry') || '';
  if (urlInd) currentIndustry = urlInd;

  fetch('/api/industries', {credentials: 'same-origin'})
    .then(function(r) { return r.ok ? r.json() : {industries: []}; })
    .then(function(data) {
      const industries = data.industries || [];
      let html = '<button class="ind-filter' + (!currentIndustry ? ' active' : '') + '" data-slug="" onclick="filterEvInd(\'\')">All</button>';
      for (let i = 0; i < industries.length; i++) {
        const ind = industries[i];
        if (!ind.is_active) continue;
        const active = ind.slug === currentIndustry ? ' active' : '';
        html += '<button class="ind-filter' + active + '" data-slug="' + escHtml(ind.slug) + '" onclick="filterEvInd(\'' + escHtml(ind.slug) + '\')">' +
          '<i class="fa-solid ' + escHtml(ind.icon_class || 'fa-briefcase') + '"></i> ' + escHtml(ind.name) + '</button>';
      }
      section.innerHTML = html;
      if (currentIndustry) renderFilteredEvents();
    })
    .catch(function() {
      const s = document.getElementById('ind-filters');
      if (s) s.innerHTML = '<button class="ind-filter active" data-slug="" onclick="filterEvInd(\'\')">All</button>';
      showToast('Could not load filters', '');
    });
}

function filterEvInd(slug) {
  currentIndustry = slug;
  document.querySelectorAll('#ind-filters .ind-filter').forEach(function(b) {
    b.classList.toggle('active', b.dataset.slug === slug);
  });
  renderFilteredEvents();
}

// ── EVENTS FETCH + RENDER ────────────────────────────────────────────────────
function evSkeleton() {
  const card = '<div class="event-card">' +
    '<div class="event-banner ev-skel-banner"></div>' +
    '<div class="event-body">' +
      '<div class="ev-skel-line" style="height:12px;width:55%;background:rgba(255,255,255,.1);margin-bottom:12px"></div>' +
      '<div class="ev-skel-line" style="height:22px;width:88%;background:rgba(255,255,255,.1);margin-bottom:10px"></div>' +
      '<div class="ev-skel-line" style="height:13px;width:68%;background:rgba(255,255,255,.07);margin-bottom:10px"></div>' +
      '<div class="ev-skel-line" style="height:52px;background:rgba(255,255,255,.07)"></div>' +
    '</div></div>';
  return card + card + card + card;
}

async function fetchAndRenderEvents() {
  const grid = document.getElementById('events-grid');
  if (!grid) return;
  grid.innerHTML = evSkeleton();

  try {
    const r = await fetch('/api/events', {credentials: 'same-origin'});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    allEvents = data.events || [];
    renderFilteredEvents();
  } catch(e) {
    grid.innerHTML = evEmptyState('No upcoming events. Check back soon!');
    showToast('Could not load events', '');
  }
}

function evEmptyState(msg) {
  return '<div style="grid-column:1/-1;text-align:center;padding:52px 20px;color:rgba(255,255,255,.55)">' +
    '<i class="fa-solid fa-calendar-xmark" style="font-size:40px;display:block;margin-bottom:16px;opacity:.4"></i>' +
    '<p style="font-size:15px">' + escHtml(msg) + '</p></div>';
}

function renderFilteredEvents() {
  const grid = document.getElementById('events-grid');
  const hint = document.getElementById('results-hint');
  if (!grid) return;

  const search = evSearchVal.toLowerCase();
  const filtered = allEvents.filter(function(ev) {
    if (currentIndustry && (!ev.industry || ev.industry.slug !== currentIndustry)) return false;
    if (search && !(ev.title || '').toLowerCase().includes(search)) return false;
    return true;
  });

  if (hint) hint.textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '') + ' available';

  if (!filtered.length) {
    grid.innerHTML = evEmptyState(search || currentIndustry ? 'No events match these filters.' : 'No upcoming events. Check back soon!');
    return;
  }

  grid.innerHTML = filtered.map(renderEventCard).join('');
}

function renderEventCard(ev) {
  const ind = ev.industry || null;
  const pal = (ind && EV_BANNER_PAL[ind.slug]) ? EV_BANNER_PAL[ind.slug] : EV_DEFAULT_PAL;

  let bannerHtml;
  if (ev.image_url) {
    bannerHtml = '<div class="event-banner" style="padding:0;overflow:hidden">' +
      '<img src="' + escHtml(ev.image_url) + '" class="event-banner-img" alt="" loading="lazy">' +
      (ev.is_featured ? '<span class="badge badge-navy" style="position:absolute;top:12px;right:12px;font-size:10px"><i class="fa-solid fa-star"></i> Featured</span>' : '') +
      '</div>';
  } else {
    const iconCls = ind ? escHtml(ind.icon_class || 'fa-calendar-days') : 'fa-calendar-days';
    bannerHtml = '<div class="event-banner" style="background:' + escHtml(pal.bg) + ';color:' + escHtml(pal.color) + ';justify-content:center;font-size:36px">' +
      '<i class="fa-solid ' + iconCls + '"></i>' +
      (ev.is_featured ? '<span class="badge badge-navy" style="position:absolute;top:12px;right:12px;font-size:10px"><i class="fa-solid fa-star"></i> Featured</span>' : '') +
      '</div>';
  }

  const meta = [fmtEvDate(ev.event_date), ev.location].filter(Boolean).join(' · ');
  const typePill = ev.event_type ? '<span class="badge badge-navy">' + escHtml(ev.event_type) + '</span>' : '';
  const indPill = ind ? '<span class="badge badge-gray">' +
    '<i class="fa-solid ' + escHtml(ind.icon_class || 'fa-briefcase') + '" style="font-size:10px;margin-right:3px"></i>' +
    escHtml(ind.name) + '</span>' : '';
  const pillRow = (typePill || indPill)
    ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + typePill + indPill + '</div>'
    : '';

  const regBtn = ev.registration_url
    ? '<a href="' + escHtml(ev.registration_url) + '" target="_blank" rel="noopener noreferrer" class="btn btn-teal btn-sm">Register <i class="fa-solid fa-arrow-right"></i></a>'
    : '';

  return '<div class="event-card">' +
    bannerHtml +
    '<div class="event-body">' +
      pillRow +
      '<div class="event-title">' + escHtml(ev.title) + '</div>' +
      (meta ? '<div class="event-meta"><span><i class="fa-solid fa-calendar-days"></i> ' + escHtml(meta) + '</span></div>' : '') +
      '<div class="event-desc">' + escHtml(ev.description) + '</div>' +
      '<div class="event-footer"><div></div>' + regBtn + '</div>' +
    '</div>' +
  '</div>';
}

// ── SEARCH INPUT ─────────────────────────────────────────────────────────────
let evSearchTimer = null;
const evSearchEl = document.getElementById('ev-search');
if (evSearchEl) {
  evSearchEl.addEventListener('input', function() {
    clearTimeout(evSearchTimer);
    evSearchTimer = setTimeout(function() {
      evSearchVal = evSearchEl.value;
      renderFilteredEvents();
    }, 300);
  });
}

// ── PROFILE MENU ─────────────────────────────────────────────────────────────
const pmToggle = document.getElementById('profile-menu-toggle');
const profileMenu = document.getElementById('profile-menu');
if(pmToggle && profileMenu){
  pmToggle.addEventListener('click', ()=>{
    const open = profileMenu.classList.toggle('open');
    pmToggle.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e)=>{
    if(!profileMenu.contains(e.target) && !pmToggle.contains(e.target)){
      profileMenu.classList.remove('open');
      pmToggle.setAttribute('aria-expanded','false');
    }
  });
}
const signoutBtn = document.getElementById('profile-signout-btn');
if(signoutBtn){
  signoutBtn.addEventListener('click', ()=>{
    fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})
      .finally(()=>{window.location.href="{% url 'login' %}";});
  });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
initEvIndustryFilters();
fetchAndRenderEvents();
</script>
<script>
/* Mobile nav hamburger — shared across authenticated templates */
(function(){
  var toggle = document.getElementById('nav-hamburger-toggle');
  var links = document.querySelector('.nav-links');
  if (!toggle || !links) return;
  toggle.addEventListener('click', function(){
    var isOpen = links.classList.toggle('is-open');
    toggle.classList.toggle('is-open', isOpen);
    toggle.setAttribute('aria-expanded', String(isOpen));
  });
  links.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      links.classList.remove('is-open');
      toggle.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
</body>
</html>
